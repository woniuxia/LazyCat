[package]
name = "lazycat-desktop"
version = "0.7.2"
description = "Lazycat desktop app"
authors = ["Lazycat Team"]
edition = "2021"

[lib]
name = "lazycat_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
regex = "1"
csv = "1"
calamine = "0.26"
serde_yml = "0.0.12"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
qrcode = "0.14"
image = { version = "0.25", default-features = true }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
blake3 = "1.5"
walkdir = "2.5"
openssl = { version = "0.10", features = ["vendored"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
ureq = { version = "2", features = ["tls"] }
tauri-plugin-dialog = "2"
encoding_rs = "0.8"
hex = "0.4"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
jsonschema = "0.18"
roxmltree = "0.20"
bcrypt = "0.15"
lopdf = "0.34"
open = "5"
url = "2"
zeroize = "1"
lnk = "0.5"
local-ip-address = "0.6"
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.59", features = [
  "Win32_Globalization",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Shell",
] }
windows-icons = "0.3"
winping = "0.10"
# wallpaper PoC (B1 spike): WebView2 CapturePreview + COM stream
# 与 wry 0.54 间接依赖的版本对齐，避免 ICoreWebView2 类型重复
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
] }
