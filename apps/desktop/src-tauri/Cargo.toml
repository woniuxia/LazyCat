[package]
name = "lazycat-desktop"
version = "0.4.1"
description = "Lazycat desktop app"
authors = ["Lazycat Team"]
edition = "2021"

[lib]
name = "lazycat_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
regex = "1"
csv = "1"
calamine = "0.26"
serde_yml = "0.0.12"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }
qrcode = "0.14"
image = { version = "0.25", default-features = true }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
blake3 = "1.5"
walkdir = "2.5"
openssl = { version = "0.10", features = ["vendored"] }
ureq = { version = "2", features = ["tls"] }
tauri-plugin-dialog = "2"
encoding_rs = "0.8"
hex = "0.4"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
jsonschema = "0.18"
roxmltree = "0.20"
bcrypt = "0.15"
lopdf = "0.34"
open = "5"
url = "2"
zeroize = "1"
lnk = "0.5"
pcap = { version = "2", optional = true }
etherparse = { version = "0.16", optional = true }
libc = { version = "0.2", optional = true }

[features]
capture = ["pcap", "etherparse", "libc"]

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.59", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Shell",
] }
windows-icons = "0.3"
winping = "0.10"
# wallpaper PoC (B1 spike): WebView2 CapturePreview + COM stream
# 与 wry 0.54 间接依赖的版本对齐，避免 ICoreWebView2 类型重复
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
] }
