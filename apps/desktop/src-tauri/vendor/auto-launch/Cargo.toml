# Vendored from crates.io auto-launch 0.5.0 (checksum
# 1f012b8cc0c850f34117ec8252a44418f2e34a2cf501de89e29b241ae5f79471).
# LazyCat only changes the non-Windows dirs dependency from 4.0 to 6.
[package]
name = "auto-launch"
version = "0.5.0"
edition = "2021"
authors = ["zzzgydi"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/zzzgydi/auto-launch.git"
keywords = ["launch", "auto-launch", "startup", "login", "login-items"]
description = "Auto launch any application or executable at startup. Supports Windows, macOS, and Linux."
exclude = ["/test-exe"]

[dependencies]
thiserror = "1"

[target."cfg(not(target_os = \"windows\"))".dependencies]
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.10" }
